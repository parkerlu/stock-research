services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: __REDACTED_DB_PASSWORD__
      POSTGRES_DB: stock_db
    ports:
      # 只绑本机与 WireGuard 隧道地址 —— 原来是 0.0.0.0, 家里任何设备
      # 连上 WiFi 都能直连数据库。10.8.0.2 是本机在隧道里的地址,
      # 供阿里云那台经隧道访问。
      - "127.0.0.1:5432:5432"
      - "10.8.0.2:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://stock:__REDACTED_DB_PASSWORD__@db:5432/stock_db
      DATABASE_URL_SYNC: postgresql+psycopg2://stock:__REDACTED_DB_PASSWORD__@db:5432/stock_db
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
    volumes:
      - ./backend/cache:/app/cache:ro
      - ./backend/models:/app/models:ro
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "0.0.0.0:80:80"
    depends_on:
      - backend


volumes:
  backend_data: {}
