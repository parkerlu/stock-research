# 生产配置 (s.doapps.cn) — 与开发版 docker-compose.yml 的区别:
#   · db / backend 不发布公网端口 (容器网络互通; Postgres 密码弱, 决不能暴露)
#   · frontend 只绑 127.0.0.1:8080, 由宿主机 Caddy 反代 + HTTPS + basic auth
#   · 全部 restart: unless-stopped
#   · 不挂载 backend/cache (1.6G 内存装不下 1G 缓存; 选股自动走慢路径)
# 用法: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: __REDACTED_DB_PASSWORD__
      POSTGRES_DB: stock_db
    # 机器升到 8G 后仍在用默认的 shared_buffers=128MB —— daily_candle 已有
    # 1144 万行, 组合扫描要反复读 400 天窗口, 128M 缓存不够, 每批都回盘。
    # 1G shared_buffers + 6G effective_cache_size 是 8G 机器的常规配比。
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://stock:__REDACTED_DB_PASSWORD__@db:5432/stock_db
      DATABASE_URL_SYNC: postgresql+psycopg2://stock:__REDACTED_DB_PASSWORD__@db:5432/stock_db
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
    volumes:
      - ./backend/models:/app/models:ro
      - backend_data:/app/data
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  backend_data: {}
